# /etc/mdev.conf (UsrsideOS, BusyBox mdev): Gerät  BENUTZER:GRUPPE  MODUS
# ohne Regel legt mdev 0660 root:root an – dann scheitern makepkg & Co. an /dev/null (Befund t1)
# Hotplug: Modul zum Gerät laden („-“: danach weiter nach der Regel für den Geräteknoten suchen)
-$MODALIAS=.*   root:root 0660 @modprobe -q -b "$MODALIAS"
null            root:root 0666
zero            root:root 0666
full            root:root 0666
random          root:root 0666
urandom         root:root 0444
tty             root:tty  0666
ptmx            root:tty  0666
console         root:tty  0600
tty[0-9]+       root:tty  0620
ttyS[0-9]+      root:tty  0660
kmsg            root:root 0640
mem             root:kmem 0640
port            root:kmem 0640
fuse            root:root 0666
kvm             root:kvm  0660
rfkill          root:root 0664
snd/.*          root:audio 0660
dri/.*          root:video 0660
fb[0-9]+        root:video 0660
input/.*        root:input 0660
sd[a-z].*       root:disk 0660
vd[a-z].*       root:disk 0660
nvme.*          root:disk 0660
sr[0-9]+        root:disk 0660
loop[0-9]+      root:disk 0660
