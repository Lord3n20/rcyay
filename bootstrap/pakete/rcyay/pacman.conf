# /etc/pacman.conf – UsrsideOS musl (rcyay)
[options]
HoldPkg     = rcyay musl
Architecture = x86_64_musl
CheckSpace
ParallelDownloads = 5
# Pakete von usrside-musl sind (noch) unsigniert; gnupg folgt
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

[usrside-musl]
SigLevel = Never
Server = file:///srv/usrside-musl
