#
# /etc/rcyay.conf – Einstellungen für rcyay (zusätzlich zu /etc/pacman.conf)
#
[options]
# AUR-Basis-URL (RPC v5 und Snapshots)
#AURURL = https://aur.archlinux.org
# Quelle für "rcyay -G" bei Repo-Paketen (Arch-gitlab)
#RepoGitURL = https://gitlab.archlinux.org/archlinux/packaging/packages
# Bauordner (root: /var/cache/rcyay, sonst ~/.cache/rcyay)
#BuildDir = ~/.cache/rcyay
# Nutzer für makepkg, wenn rcyay als root läuft (wird bei Bedarf angelegt)
#BuildUser = rcyay-bau
# Programm für Root-Rechte, wenn rcyay als normaler Nutzer läuft
#Sudo = sudo
# Bauabhängigkeiten nach dem Bau entfernen
#RemoveMake = yes
# AUR-Suchergebnisse sortieren: votes, popularity, name, modified
#SortBy = votes
# Reihenfolge: BottomUp (beste Treffer unten, Standard) oder TopDown
#BottomUp
# Fehlende PGP-Schlüssel aus validpgpkeys vor dem Bau per gpg --recv-keys holen
# (fragt nach, mit --noconfirm automatisch)
#PGPFetch = yes
# Schlüsselserver dafür (leer = Standard von gpg/dirmngr, wie yay)
#PGPKeyserver = hkps://keyserver.ubuntu.com
# Overlay mit nur-glibc.txt und dienste/ (Standard /usr/share/rcyay/overlay)
#Overlay = /usr/share/rcyay/overlay
# Abhängigkeiten, die das System selbst erfüllt (z. B. BusyBox statt GNU-Werkzeugen):
# NAME oder NAME=VERSION, durch Leerzeichen getrennt, mehrere Zeilen erlaubt.
# rcyay hält dafür das Metapaket usrside-provides (provides=(…)) aktuell, vor jedem
# -S/-U; ohne Version erfüllt ein Eintrag nur Abhängigkeiten ohne Versionsangabe.
# Standard: leer (nur setzen, wo kein Paket GNU-Optionen braucht).
#VirtualProvides = which
# Init für rcyay-dienste: systemd (Standard, nichts tun), busybox, runit, s6
#Init = systemd
